name: Deploy

run-name: >-
  Deployment: ${{ inputs.artifact_name }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - pre
          - prod

      artifact_name:
        description: "Artifact name to deploy"
        required: true
        type: string

      source_run_id:
        description: "Run ID of the workflow that produced the artifact"
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: ${{ inputs.environment == 'dev' }}
    name: Deploy selected artifact to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Show deployment inputs
        run: |
          echo "::group::Deployment inputs"
          echo "Environment: ${{ inputs.environment }}"
          echo "Artifact name: ${{ inputs.artifact_name }}"
          echo "Source run ID: ${{ inputs.source_run_id }}"
          echo "Expected DEV URL: https://thek3v.github.io/kw/"
          echo "::notice::10% - Inputs received correctly"
          echo "::endgroup::"

      - name: Validate deployment policy
        run: |
          echo "::group::Validating deployment policy"

          ENV="${{ inputs.environment }}"
          ARTIFACT="${{ inputs.artifact_name }}"

          if [[ "$ENV" != "dev" ]]; then
            echo "::error::This KW workflow currently only deploys to dev."
            exit 1
          fi

          if [[ "$ARTIFACT" == *SNAPSHOT* ]]; then
            echo "::notice::DEV accepts SNAPSHOT artifact."
          elif [[ "$ARTIFACT" == release-* ]]; then
            echo "::notice::DEV accepts closed release artifact."
          else
            echo "::error::DEV only accepts SNAPSHOT artifacts or release-* artifacts."
            exit 1
          fi

          echo "::notice::25% - Deployment policy validated"
          echo "::endgroup::"

      - name: List artifacts from source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Artifacts available in source run"
          gh api repos/${{ github.repository }}/actions/runs/${{ inputs.source_run_id }}/artifacts \
            --jq '.artifacts[] | "- " + .name'
          echo "::endgroup::"

      - name: Download selected artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Downloading selected artifact"
          mkdir -p downloaded

          gh run download "${{ inputs.source_run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${{ inputs.artifact_name }}" \
            --dir downloaded

          echo "::notice::40% - Artifact downloaded"
          echo "::endgroup::"

      - name: Inspect downloaded artifact
        run: |
          echo "::group::Downloaded artifact"
          pwd
          echo ""
          echo "Directories:"
          find downloaded -maxdepth 4 -type d | sort
          echo ""
          echo "Files:"
          find downloaded -maxdepth 6 -type f | sort
          echo "::notice::50% - Downloaded artifact inspected"
          echo "::endgroup::"

      - name: Resolve artifact paths
        id: paths
        run: |
          echo "::group::Resolve artifact paths"

          VERSION_FILE=$(find downloaded -type f -name VERSION | head -n 1)

          if [ -z "$VERSION_FILE" ]; then
            echo "::error::VERSION file not found inside downloaded artifact"
            find downloaded -maxdepth 6 -type f | sort
            exit 1
          fi

          ARTIFACT_ROOT=$(dirname "$VERSION_FILE")

          if [ -f "$ARTIFACT_ROOT/web/index.html" ]; then
            WEB_ROOT="$ARTIFACT_ROOT/web"
          else
            INDEX_FILE=$(find downloaded -type f -name index.html | head -n 1)

            if [ -z "$INDEX_FILE" ]; then
              echo "::error::index.html not found inside downloaded artifact"
              find downloaded -maxdepth 6 -type f | sort
              exit 1
            fi

            WEB_ROOT=$(dirname "$INDEX_FILE")
          fi

          echo "Artifact root: $ARTIFACT_ROOT"
          echo "Web root: $WEB_ROOT"

          echo "artifact_root=$ARTIFACT_ROOT" >> "$GITHUB_OUTPUT"
          echo "web_root=$WEB_ROOT" >> "$GITHUB_OUTPUT"

          echo "::notice::60% - Artifact paths resolved"
          echo "::endgroup::"

      - name: Validate downloaded web files
        run: |
          echo "::group::Validating downloaded web files"

          WEB_ROOT="${{ steps.paths.outputs.web_root }}"

          echo "Validating web files at: $WEB_ROOT"

          test -f "$WEB_ROOT/index.html"
          test -f "$WEB_ROOT/styles.css"
          test -f "$WEB_ROOT/script.js"

          if [ ! -d "$WEB_ROOT/assets" ]; then
            echo "assets directory not found. Creating empty assets directory."
            mkdir -p "$WEB_ROOT/assets"
          fi

          echo "::notice::70% - Web files validated"
          echo "::endgroup::"

      - name: Prepare GitHub Pages site
        run: |
          echo "::group::Preparing GitHub Pages site"

          ARTIFACT_ROOT="${{ steps.paths.outputs.artifact_root }}"
          WEB_ROOT="${{ steps.paths.outputs.web_root }}"

          mkdir -p site

          cp "$WEB_ROOT/index.html" site/
          cp "$WEB_ROOT/styles.css" site/
          cp "$WEB_ROOT/script.js" site/
          cp -r "$WEB_ROOT/assets" site/

          if [ -f "$ARTIFACT_ROOT/VERSION" ]; then
            cp "$ARTIFACT_ROOT/VERSION" site/
          fi

          echo "Environment: DEV" > site/DEPLOYMENT_INFO.txt
          echo "Deployment URL: https://thek3v.github.io/kw/" >> site/DEPLOYMENT_INFO.txt
          echo "Artifact: ${{ inputs.artifact_name }}" >> site/DEPLOYMENT_INFO.txt
          echo "Source run id: ${{ inputs.source_run_id }}" >> site/DEPLOYMENT_INFO.txt
          echo "Deployed by: ${{ github.actor }}" >> site/DEPLOYMENT_INFO.txt
          echo "Deploy workflow ref: ${{ github.ref_name }}" >> site/DEPLOYMENT_INFO.txt

          if [ -f "$ARTIFACT_ROOT/BUILD_COMMIT" ]; then
            echo "Commit: $(cat "$ARTIFACT_ROOT/BUILD_COMMIT")" >> site/DEPLOYMENT_INFO.txt
          fi

          if [ -f "$ARTIFACT_ROOT/BUILD_BRANCH" ]; then
            echo "Build branch: $(cat "$ARTIFACT_ROOT/BUILD_BRANCH")" >> site/DEPLOYMENT_INFO.txt
          fi

          if [ -f "$ARTIFACT_ROOT/BUILD_DATE" ]; then
            echo "Build date: $(cat "$ARTIFACT_ROOT/BUILD_DATE")" >> site/DEPLOYMENT_INFO.txt
          fi

          if [ -f "$ARTIFACT_ROOT/BUILD_TIMESTAMP" ]; then
            echo "Build timestamp: $(cat "$ARTIFACT_ROOT/BUILD_TIMESTAMP")" >> site/DEPLOYMENT_INFO.txt
          fi

          echo ""
          echo "Final site content:"
          find site -maxdepth 4 -type f | sort

          echo "::notice::80% - GitHub Pages site prepared"
          echo "::endgroup::"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployment URL
        run: |
          echo "::notice::Deployment URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Deployment URL: ${{ steps.deployment.outputs.page_url }}"
          echo "::notice::100% - Deployment completed successfully"

  deploy-prod:
    if: ${{ inputs.environment == 'prod' }}
    name: Deploy stable release to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://kw-web-prod.pages.dev
    concurrency:
      group: kw-cloudflare-production
      cancel-in-progress: false
    env:
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Validate production deployment inputs and source run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Source run ID must be numeric"
            exit 1
          fi
          if [[ ! "$ARTIFACT_NAME" =~ ^release-kw-web-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::PROD only accepts release-kw-web-X.Y.Z artifacts"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          RUN_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
          RUN_PATH=$(jq -r '.path' <<< "$RUN_JSON")
          RUN_EVENT=$(jq -r '.event' <<< "$RUN_JSON")
          RUN_BRANCH=$(jq -r '.head_branch' <<< "$RUN_JSON")
          RUN_STATUS=$(jq -r '.conclusion' <<< "$RUN_JSON")
          RUN_SHA=$(jq -r '.head_sha' <<< "$RUN_JSON")
          if [[ "$RUN_PATH" != ".github/workflows/release.yml" || "$RUN_EVENT" != "workflow_dispatch" || "$RUN_BRANCH" != "main" || "$RUN_STATUS" != "success" ]]; then
            echo "::error::Source must be a successful manual Release workflow run on main"
            exit 1
          fi
          if [[ ! "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid source commit SHA"
            exit 1
          fi
          TAG_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" --jq '.object.sha')
          TAG_TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" --jq '.object.type')
          if [[ "$TAG_TYPE" == "tag" ]]; then
            TAG_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_SHA}" --jq '.object.sha')
          fi
          if [[ "$TAG_SHA" != "$RUN_SHA" ]]; then
            echo "::error::Release tag does not point to source run commit"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          echo "Validated release v$VERSION from main at $RUN_SHA"

      - name: Verify CI Checks succeeded for release commit
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CI_RUNS=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci-checks.yml/runs" \
            -f head_sha="$SOURCE_SHA" -f event=push -f status=success -f per_page=100)
          COUNT=$(jq '[.workflow_runs[] | select(.head_sha == env.SOURCE_SHA and .head_branch == "main" and .conclusion == "success")] | length' <<< "$CI_RUNS")
          if [[ "$COUNT" -lt 1 ]]; then
            echo "::error::No successful push CI Checks run on main for release commit"
            exit 1
          fi
          echo "Successful CI Checks runs for release commit: $COUNT"

      - name: Download selected release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir downloaded

      - name: Validate release contents and prepare production site
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f downloaded/VERSION
          test -f downloaded/BUILD_VERSION
          test -f downloaded/BUILD_COMMIT
          test -f downloaded/BUILD_BRANCH
          test -f downloaded/BUILD_TYPE
          test -f downloaded/ARTIFACT_NAME
          [[ "$(cat downloaded/VERSION)" == "$RELEASE_VERSION" ]]
          [[ "$(cat downloaded/BUILD_VERSION)" == "$RELEASE_VERSION" ]]
          [[ "$(cat downloaded/BUILD_COMMIT)" == "$SOURCE_SHA" ]]
          [[ "$(cat downloaded/BUILD_BRANCH)" == "main" ]]
          [[ "$(cat downloaded/BUILD_TYPE)" == "RELEASE" ]]
          [[ "$(cat downloaded/ARTIFACT_NAME)" == "$ARTIFACT_NAME" ]]
          test -f downloaded/web/index.html
          test -f downloaded/web/styles.css
          test -f downloaded/web/script.js
          mkdir -p site
          cp -a downloaded/web/. site/
          cp downloaded/VERSION site/
          {
            echo "Environment: PROD"
            echo "Deployment URL: https://kw-web-prod.pages.dev"
            echo "Artifact: $ARTIFACT_NAME"
            echo "Source run id: $SOURCE_RUN_ID"
            echo "Deployed by: $GITHUB_ACTOR"
            echo "Deploy workflow ref: $GITHUB_REF_NAME"
            echo "Commit: $SOURCE_SHA"
            echo "Build branch: main"
            if [[ -f downloaded/BUILD_DATE ]]; then
              echo "Build date: $(cat downloaded/BUILD_DATE)"
            fi
            if [[ -f downloaded/BUILD_TIMESTAMP ]]; then
              echo "Build timestamp: $(cat downloaded/BUILD_TIMESTAMP)"
            fi
          } > site/DEPLOYMENT_INFO.txt
          find site -maxdepth 4 -type f | sort

      - name: Deploy release to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare repository secrets are missing"
            exit 1
          fi
          npx --yes wrangler@3 pages deploy site \
            --project-name=kw-web-prod \
            --branch=main

  reject-pre:
    if: ${{ inputs.environment == 'pre' }}
    name: PRE is not configured
    runs-on: ubuntu-latest
    steps:
      - name: Explain PRE status
        run: |
          echo "::error::PRE deployment is not configured for KW yet."
          exit 1
