name: Deploy

run-name: >-
  Deployment: ${{ inputs.artifact_name }} to
  ${{ inputs.environment == 'dev' && 'certification development environment' || inputs.environment == 'pre' && 'pre-production environment' || 'production environment' }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - pre
          - prod

      artifact_name:
        description: "Artifact name to deploy"
        required: true
        type: string

      source_run_id:
        description: "Run ID of the Integration workflow that produced the artifact"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy selected artifact
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Show deployment inputs
        run: |
          echo "::group::Deployment inputs"
          echo "Environment: ${{ inputs.environment }}"
          echo "Artifact name: ${{ inputs.artifact_name }}"
          echo "Source run ID: ${{ inputs.source_run_id }}"
          echo "::endgroup::"

      - name: Validate deployment policy
        run: |
          ENV="${{ inputs.environment }}"
          ARTIFACT="${{ inputs.artifact_name }}"

          if [[ "$ENV" == "dev" || "$ENV" == "pre" ]]; then
            if [[ "$ARTIFACT" != *SNAPSHOT* ]]; then
              echo "::error::DEV/PRE only accept SNAPSHOT artifacts"
              exit 1
            fi
          fi

          if [[ "$ENV" == "prod" ]]; then
            if [[ "$ARTIFACT" == *SNAPSHOT* ]]; then
              echo "::error::PROD does not accept SNAPSHOT artifacts"
              exit 1
            fi
          fi

      - name: Download selected artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: downloaded
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Inspect downloaded artifact
        run: |
          echo "::group::Downloaded artifact"
          pwd
          find downloaded -maxdepth 6 -type f | sort
          echo "::endgroup::"

      - name: Resolve downloaded artifact root
        id: artifact_root
        run: |
          VERSION_FILE=$(find downloaded -type f -name VERSION | head -n 1)

          if [ -z "$VERSION_FILE" ]; then
            echo "::error::VERSION file not found inside downloaded artifact"
            find downloaded -maxdepth 6 -type f | sort
            exit 1
          fi

          ROOT_DIR=$(dirname "$VERSION_FILE")
          echo "root=$ROOT_DIR" >> "$GITHUB_OUTPUT"

          echo "Resolved artifact root: $ROOT_DIR"

      - name: Validate downloaded artifact
        run: |
          ROOT="${{ steps.artifact_root.outputs.root }}"

          echo "Validating artifact at root: $ROOT"

          test -f "$ROOT/VERSION"
          test -f "$ROOT/web/index.html"
          test -f "$ROOT/web/styles.css"
          test -f "$ROOT/web/script.js"
          test -d "$ROOT/web/assets"

      - name: Prepare GitHub Pages site
        if: ${{ inputs.environment == 'dev' }}
        run: |
          ROOT="${{ steps.artifact_root.outputs.root }}"

          mkdir -p site

          cp "$ROOT/web/index.html" site/
          cp "$ROOT/web/styles.css" site/
          cp "$ROOT/web/script.js" site/
          cp -r "$ROOT/web/assets" site/
          cp "$ROOT/VERSION" site/

          echo "Environment: DEV" > site/DEPLOYMENT_INFO.txt
          echo "Artifact: ${{ inputs.artifact_name }}" >> site/DEPLOYMENT_INFO.txt
          echo "Source run id: ${{ inputs.source_run_id }}" >> site/DEPLOYMENT_INFO.txt

          if [ -f "$ROOT/BUILD_COMMIT" ]; then
            echo "Commit: $(cat "$ROOT/BUILD_COMMIT")" >> site/DEPLOYMENT_INFO.txt
          fi

          if [ -f "$ROOT/BUILD_DATE" ]; then
            echo "Build date: $(cat "$ROOT/BUILD_DATE")" >> site/DEPLOYMENT_INFO.txt
          fi

          if [ -f "$ROOT/BUILD_TIMESTAMP" ]; then
            echo "Build timestamp: $(cat "$ROOT/BUILD_TIMESTAMP")" >> site/DEPLOYMENT_INFO.txt
          fi

      - name: Configure GitHub Pages
        if: ${{ inputs.environment == 'dev' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ inputs.environment == 'dev' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: ${{ inputs.environment == 'dev' }}
        uses: actions/deploy-pages@v4