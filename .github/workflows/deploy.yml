name: Deploy

run-name: >-
  Deployment: ${{ inputs.artifact_name }} to DEV GitHub Pages

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - pre
          - prod

      artifact_name:
        description: "Artifact name to deploy"
        required: true
        type: string

      source_run_id:
        description: "Run ID of the Integration workflow that produced the artifact"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy selected artifact to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Show deployment inputs
        run: |
          echo "::group::Deployment inputs"
          echo "Environment: ${{ inputs.environment }}"
          echo "Artifact name: ${{ inputs.artifact_name }}"
          echo "Source run ID: ${{ inputs.source_run_id }}"
          echo "Expected DEV URL: https://thek3v.github.io/kw/"
          echo "::notice::10% - Inputs received correctly"
          echo "::endgroup::"

      - name: Validate deployment policy
        run: |
          echo "::group::Validating deployment policy"

          ENV="${{ inputs.environment }}"
          ARTIFACT="${{ inputs.artifact_name }}"

          if [[ "$ENV" != "dev" ]]; then
            echo "::error::This KW workflow currently only deploys to dev."
            exit 1
          fi

          if [[ "$ARTIFACT" != *SNAPSHOT* ]]; then
            echo "::error::DEV only accepts SNAPSHOT artifacts."
            exit 1
          fi

          echo "::notice::25% - Deployment policy validated"
          echo "::endgroup::"

      - name: List artifacts from source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Artifacts available in source run"
          gh api repos/${{ github.repository }}/actions/runs/${{ inputs.source_run_id }}/artifacts \
            --jq '.artifacts[] | "- " + .name'
          echo "::endgroup::"

      - name: Download selected artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Downloading selected artifact"
          mkdir -p downloaded

          gh run download "${{ inputs.source_run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${{ inputs.artifact_name }}" \
            --dir downloaded

          echo "::notice::40% - Artifact downloaded"
          echo "::endgroup::"

      - name: Inspect downloaded artifact
        run: |
          echo "::group::Downloaded artifact"
          pwd
          echo ""
          echo "Directories:"
          find downloaded -maxdepth 4 -type d | sort
          echo ""
          echo "Files:"
          find downloaded -maxdepth 6 -type f | sort
          echo "::notice::50% - Downloaded artifact inspected"
          echo "::endgroup::"

      - name: Resolve artifact paths
        id: paths
        run: |
          echo "::group::Resolve artifact paths"

          VERSION_FILE=$(find downloaded -type f -name VERSION | head -n 1)

          if [ -z "$VERSION_FILE" ]; then
            echo "::error::VERSION file not found inside downloaded artifact"
            find downloaded -maxdepth 6 -type f | sort
            exit 1
          fi

          ARTIFACT_ROOT=$(dirname "$VERSION_FILE")

          if [ -f "$ARTIFACT_ROOT/web/index.html" ]; then
            WEB_ROOT="$ARTIFACT_ROOT/web"
          else
            INDEX_FILE=$(find downloaded -type f -name index.html | head -n 1)

            if [ -z "$INDEX_FILE" ]; then
              echo "::error::index.html not found inside downloaded artifact"
              find downloaded -maxdepth 6 -type f | sort
              exit 1
            fi

            WEB_ROOT=$(dirname "$INDEX_FILE")
          fi

          echo "Artifact root: $ARTIFACT_ROOT"
          echo "Web root: $WEB_ROOT"

          echo "artifact_root=$ARTIFACT_ROOT" >> "$GITHUB_OUTPUT"
          echo "web_root=$WEB_ROOT" >> "$GITHUB_OUTPUT"

          echo "::notice::60% - Artifact paths resolved"
          echo "::endgroup::"

      - name: Validate downloaded web files
        run: |
          echo "::group::Validating downloaded web files"

          WEB_ROOT="${{ steps.paths.outputs.web_root }}"

          echo "Validating web files at: $WEB_ROOT"

          test -f "$WEB_ROOT/index.html"
          test -f "$WEB_ROOT/styles.css"
          test -f "$WEB_ROOT/script.js"

          if [ ! -d "$WEB_ROOT/assets" ]; then
            echo "assets directory not found. Creating empty assets directory."
            mkdir -p "$WEB_ROOT/assets"
          fi

          echo "::notice::70% - Web files validated"
          echo "::endgroup::"

      - name: Prepare GitHub Pages site
        run: |
          echo "::group::Preparing GitHub Pages site"

          ARTIFACT_ROOT="${{ steps.paths.outputs.artifact_root }}"
          WEB_ROOT="${{ steps.paths.outputs.web_root }}"

          mkdir -p site

          cp "$WEB_ROOT/index.html" site/
          cp "$WEB_ROOT/styles.css" site/
          cp "$WEB_ROOT/script.js" site/
          cp -r "$WEB_ROOT/assets" site/

          if [ -f "$ARTIFACT_ROOT/VERSION" ]; then
            cp "$ARTIFACT_ROOT/VERSION" site/
          fi

          echo "Environment: DEV" > site/DEPLOYMENT_INFO.txt
          echo "Deployment URL: https://thek3v.github.io/kw/" >> site/DEPLOYMENT_INFO.txt
          echo "Artifact: ${{ inputs.artifact_name }}" >> site/DEPLOYMENT_INFO.txt
          echo "Source run id: ${{ inputs.source_run_id }}" >> site/DEPLOYMENT_INFO.txt
          echo "Deployed by: ${{ github.actor }}" >> site/DEPLOYMENT_INFO.txt
          echo "Deploy workflow ref: ${{ github.ref_name }}" >> site/DEPLOYMENT_INFO.txt

          if [ -f "$ARTIFACT_ROOT/BUILD_COMMIT" ]; then
            echo "Commit: $(cat "$ARTIFACT_ROOT/BUILD_COMMIT")" >> site/DEPLOYMENT_INFO.txt
          fi

          if [ -f "$ARTIFACT_ROOT/BUILD_BRANCH" ]; then
            echo "Build branch: $(cat "$ARTIFACT_ROOT/BUILD_BRANCH")" >> site/DEPLOYMENT_INFO.txt
          fi

          if [ -f "$ARTIFACT_ROOT/BUILD_DATE" ]; then
            echo "Build date: $(cat "$ARTIFACT_ROOT/BUILD_DATE")" >> site/DEPLOYMENT_INFO.txt
          fi

          if [ -f "$ARTIFACT_ROOT/BUILD_TIMESTAMP" ]; then
            echo "Build timestamp: $(cat "$ARTIFACT_ROOT/BUILD_TIMESTAMP")" >> site/DEPLOYMENT_INFO.txt
          fi

          echo ""
          echo "Final site content:"
          find site -maxdepth 4 -type f | sort

          echo "::notice::80% - GitHub Pages site prepared"
          echo "::endgroup::"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployment URL
        run: |
          echo "::notice::Deployment URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Deployment URL: ${{ steps.deployment.outputs.page_url }}"
          echo "::notice::100% - Deployment completed successfully"
